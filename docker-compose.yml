name: bridge-ecosystem
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./infra/postgres/002-platform-expansion.sql:/docker-entrypoint-initdb.d/002-platform-expansion.sql:ro
      - ./infra/postgres/003-gap-closures.sql:/docker-entrypoint-initdb.d/003-gap-closures.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [bridge]

  db-migrate:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./infra/postgres/migrations:/migrations:ro
      - ./infra/postgres/003-gap-closures.sql:/migrations/003-gap-closures.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks: [bridge]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [bridge]

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [nats_data:/data]
    ports: ["8222:8222"]
    networks: [bridge]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./infra/keycloak/bridge-realm.json:/opt/keycloak/data/import/bridge-realm.json:ro
    ports: ["8081:8080"]
    networks: [bridge]

  api:
    build: ./services/platform-api
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      BRIDGE_JWT_ISSUER: ${BRIDGE_JWT_ISSUER}
      BRIDGE_JWKS_URL: http://keycloak:8080/realms/bridge/protocol/openid-connect/certs
      BRIDGE_JWT_AUDIENCE: ${BRIDGE_JWT_AUDIENCE}
      BRIDGE_REQUIRE_JWT: ${BRIDGE_REQUIRE_JWT:-0}
      BRIDGE_TRUST_HEADERS: ${BRIDGE_TRUST_HEADERS:-1}
      BRIDGE_SECRETS_KEY: ${BRIDGE_SECRETS_KEY:-bridge-lab-secrets-key-change-me}
      BRIDGE_SECRETS_PROVIDER: ${BRIDGE_SECRETS_PROVIDER:-lab}
      BRIDGE_QUARANTINE_DIR: /data/quarantine
      BRIDGE_CORS_ORIGINS: ${BRIDGE_CORS_ORIGINS:-http://localhost:5173}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-}
      BRIDGE_AI_BASE_URL: ${BRIDGE_AI_BASE_URL}
      BRIDGE_AI_API_KEY: ${BRIDGE_AI_API_KEY}
      BRIDGE_AI_MODEL: ${BRIDGE_AI_MODEL}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      WORDPRESS_INTERNAL_URL: http://wordpress
      MONGODB_URL: ${MONGODB_URL:-}
      MSSQL_HOST: ${MSSQL_HOST:-mssql}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD:-}
    volumes:
      - api_quarantine:/data/quarantine
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      keycloak: {condition: service_started}
    ports: ["4000:4000"]
    networks: [bridge]

  outbox-relay:
    build: ./services/outbox-relay
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NATS_URL: nats://nats:4222
      BRIDGE_JS_STREAM: ${BRIDGE_JS_STREAM:-BRIDGE_EVENTS}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
      OUTBOX_BATCH: ${OUTBOX_BATCH:-50}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks: [bridge]

  provision-worker:
    build: ./services/provision-worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NATS_URL: nats://nats:4222
      BRIDGE_JS_STREAM: ${BRIDGE_JS_STREAM:-BRIDGE_EVENTS}
      BRIDGE_JS_DURABLE: ${BRIDGE_JS_DURABLE:-PROVISION_WORKER_V1}
      BRIDGE_JS_FILTER: ${BRIDGE_JS_FILTER:-provision.requested}
      BRIDGE_JS_ACK_WAIT_NS: ${BRIDGE_JS_ACK_WAIT_NS:-30000000000}
      BRIDGE_JS_MAX_DELIVER: ${BRIDGE_JS_MAX_DELIVER:-5}
      MONGODB_URL: ${MONGODB_URL:-}
      MSSQL_HOST: ${MSSQL_HOST:-mssql}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres: {condition: service_healthy}
      nats: {condition: service_started}
      outbox-relay: {condition: service_started}
    networks: [bridge]

  frontend-mcp:
    build: ./services/frontend-mcp
    environment:
      PORT: 3100
      BRIDGE_MCP_KEY: ${BRIDGE_MCP_KEY}
    ports: ["3100:3100"]
    networks: [bridge]

  control-center:
    build: ./apps/control-center
    environment:
      VITE_BRIDGE_API_URL: ${VITE_BRIDGE_API_URL}
    depends_on: [api]
    ports: ["5173:80"]
    networks: [bridge]

  wordpress-db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WP_DB_PASSWORD}
    volumes: [wordpress_db:/var/lib/mysql]
    networks: [bridge]

  wordpress:
    image: wordpress:7.1.0-php8.3-apache
    depends_on: [wordpress-db]
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      BRIDGE_API_URL: http://api:4000
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/plugins/bridge-connector:/var/www/html/wp-content/plugins/bridge-connector:ro
    ports: ["8080:80"]
    networks: [bridge]

  mongodb:
    image: mongo:7.0
    profiles: ["mongodb", "databases"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-bridge}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-bridge-mongo-change-me}
    volumes: [mongodb_data:/data/db]
    ports: ["27017:27017"]
    networks: [bridge]

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["mssql", "databases"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:-Bridge_MsSql_ChangeMe1}
    volumes: [mssql_data:/var/opt/mssql]
    ports: ["1433:1433"]
    networks: [bridge]

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    profiles: ["full"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["8123:8123"]
    networks: [bridge]
    # When using profile full, set CLICKHOUSE_URL=http://clickhouse:8123 on api

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["full"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [bridge]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["full"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: bridge-grafana-change-me
    ports: ["3001:3000"]
    networks: [bridge]

volumes:
  postgres_data:
  redis_data:
  nats_data:
  wordpress_db:
  wordpress_data:
  clickhouse_data:
  api_quarantine:
  mongodb_data:
  mssql_data:

networks:
  bridge:
    driver: bridge
